name: Release

# Cuts a signed + notarized release when a vX.Y.Z tag is pushed.
# This is a thin wrapper around scripts/release.sh (the single source of truth):
# it sets up a temporary signing keychain and the notary API key, then runs the
# same script you'd run locally, in --publish mode.
#
# To release: make release VERSION=X.Y.Z (bumps, commits, tags and pushes).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish (create release + bump tap)? Leave off to just test build + notarize.'
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub release (+ tag) in this repo

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check required secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          missing=0
          for s in DEVELOPER_ID_P12_BASE64 P12_PASSWORD NOTARY_API_KEY_P8_BASE64 \
                   NOTARY_KEY_ID NOTARY_ISSUER_ID TAP_PUSH_TOKEN; do
            if [ -z "${!s}" ]; then echo "::error::Missing required secret: $s"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Add them in Settings → Secrets and variables → Actions."; exit 1; }
          echo "All required secrets present."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history + tags

      - name: Select newest Xcode
        run: |
          sw_vers
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          # Put our keychain first in the search list (keep the existing ones) and make it default.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write notary API key
        env:
          P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Configure git identity (for the tap commit)
        run: |
          git config --global user.name  "BrewDock Release Bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Build, sign, notarize, publish
        env:
          GH_TOKEN: ${{ github.token }}                       # gh release create
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}        # push the cask bump
          NOTARY_KEY_P8: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # Tag pushes always publish; manual runs publish only if asked.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            ./scripts/release.sh --publish
          else
            ./scripts/release.sh
          fi
