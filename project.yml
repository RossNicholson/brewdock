name: BrewDock
options:
  bundleIdPrefix: com.rossnicholson
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BrewDock:
    type: application
    platform: macOS
    sources:
      - path: BrewDock
    info:
      path: BrewDock/Info.plist
      properties:
        CFBundleDisplayName: BrewDock
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "18"
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.BrewDock
        CODE_SIGN_ENTITLEMENTS: BrewDock/BrewDock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - BrewDockTests

  BrewDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrewDockTests
    dependencies:
      - target: BrewDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.BrewDockTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
